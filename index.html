<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081321">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="K30i Wi-Fi">
  <title>K30i - Assistente Wi-Fi</title>
  <style>
    :root {
      --azul-escuro: #081321;
      --azul: #0788e5;
      --azul-claro: #eaf5ff;
      --verde: #20a55a;
      --verde-escuro: #13723c;
      --amarelo: #f4b400;
      --vermelho: #d93025;
      --texto: #17202a;
      --texto-suave: #67717d;
      --linha: #dde3e8;
      --fundo: #eef3f6;
      --branco: #ffffff;
      --balao-app: #ffffff;
      --balao-cliente: #d9fdd3;
      --sombra: 0 10px 30px rgba(1, 23, 42, .14);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #dfe6eb;
      color: var(--texto);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }

    #app {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--fundo);
      box-shadow: 0 0 40px rgba(0,0,0,.16);
    }

    .topbar {
      padding: calc(10px + var(--safe-top)) 14px 10px;
      background: linear-gradient(135deg, #07121f 0%, #0b2035 68%, #073f68 100%);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: calc(68px + var(--safe-top));
      box-shadow: 0 2px 12px rgba(0,0,0,.28);
      z-index: 4;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: rgba(255,255,255,.1);
      display: grid;
      grid-template-columns: repeat(2, 9px);
      grid-template-rows: repeat(2, 9px);
      place-content: center;
      gap: 3px;
      flex: none;
      border: 1px solid rgba(255,255,255,.14);
    }
    .brand-mark i { display: block; background: #fff; border-radius: 2px; }
    .head-text { min-width: 0; flex: 1; }
    .head-title { font-size: 17px; font-weight: 800; letter-spacing: .1px; line-height: 1.2; }
    .head-subtitle { margin-top: 3px; font-size: 11.5px; color: rgba(255,255,255,.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .network-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.1);
      font-size: 10.5px;
      color: rgba(255,255,255,.9);
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,.12);
    }
    .network-dot { width: 8px; height: 8px; border-radius: 50%; background: #b0bec5; box-shadow: 0 0 0 3px rgba(176,190,197,.14); }
    .network-pill.online .network-dot { background: #43d17d; box-shadow: 0 0 0 3px rgba(67,209,125,.18); }
    .network-pill.offline .network-dot { background: #ffca28; box-shadow: 0 0 0 3px rgba(255,202,40,.18); }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px 22px;
      scroll-behavior: smooth;
      background-color: #eaf0f2;
      background-image:
        radial-gradient(circle at 20px 20px, rgba(8, 136, 229, .045) 1.4px, transparent 1.5px),
        radial-gradient(circle at 70px 70px, rgba(32, 165, 90, .04) 1.4px, transparent 1.5px);
      background-size: 90px 90px;
    }
    .day-separator {
      width: fit-content;
      margin: 2px auto 14px;
      padding: 6px 10px;
      border-radius: 9px;
      background: rgba(255,255,255,.78);
      color: #53606c;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .5px;
      box-shadow: 0 1px 5px rgba(0,0,0,.07);
    }
    .message-row { display: flex; margin: 9px 0; }
    .message-row.user { justify-content: flex-end; }
    .message-row.app { justify-content: flex-start; }
    .bubble {
      max-width: 92%;
      border-radius: 14px;
      padding: 11px 12px 8px;
      position: relative;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
      font-size: 13.5px;
      line-height: 1.42;
    }
    .message-row.app .bubble { background: var(--balao-app); border-top-left-radius: 4px; }
    .message-row.user .bubble { background: var(--balao-cliente); border-top-right-radius: 4px; }
    .time { display: block; text-align: right; color: #88929c; font-size: 9.5px; margin-top: 4px; }
    .intro-title { font-size: 15px; font-weight: 800; margin-bottom: 5px; }
    .intro-note { color: var(--texto-suave); font-size: 12px; }

    .quick-actions { display: grid; gap: 8px; margin-top: 11px; }
    .quick-btn {
      width: 100%;
      border: 1px solid #cfe0ec;
      background: #f8fcff;
      color: #0b5d93;
      border-radius: 11px;
      padding: 10px 12px;
      text-align: left;
      font-weight: 750;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .quick-btn:active { transform: scale(.99); }

    .answer-card { margin-top: 2px; }
    .answer-header { display: flex; align-items: flex-start; gap: 10px; }
    .answer-icon {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center;
      background: var(--azul-claro); color: var(--azul); flex: none;
      font-size: 20px;
    }
    .answer-title { font-weight: 850; font-size: 16px; line-height: 1.2; }
    .source-chip {
      margin-top: 5px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 7px;
      border-radius: 999px;
      background: #edf7ef;
      color: var(--verde-escuro);
      font-size: 10px;
      font-weight: 750;
    }
    .path-box {
      margin: 12px 0 10px;
      background: #f5f8fa;
      border: 1px solid #e0e7ec;
      border-left: 4px solid var(--azul);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 12px;
    }
    .path-box strong { color: #0b5d93; }
    .steps { display: grid; gap: 9px; margin: 10px 0; }
    .step { display: grid; grid-template-columns: 28px 1fr; gap: 9px; align-items: flex-start; }
    .step-number {
      width: 28px; height: 28px; border-radius: 50%;
      display: grid; place-items: center;
      background: #0b79c7; color: white; font-weight: 850; font-size: 12px;
      box-shadow: 0 3px 8px rgba(11,121,199,.22);
    }
    .step-text { padding-top: 3px; }
    .step-text strong { color: #111b23; }
    .warning {
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 8px;
      align-items: flex-start;
      margin-top: 12px;
      padding: 9px 10px;
      background: #fff8e6;
      border: 1px solid #f2d98e;
      border-radius: 10px;
      color: #5d4800;
      font-size: 11.5px;
    }
    .status-tip {
      margin-top: 9px;
      padding: 9px 10px;
      border-radius: 10px;
      background: #eef7ff;
      border: 1px solid #cfe4f5;
      font-size: 11.5px;
      color: #24516f;
    }
    .resource-title {
      margin-top: 14px;
      color: #5e6974;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .55px;
      text-transform: uppercase;
    }
    .resource-grid { display: grid; gap: 8px; margin-top: 8px; }
    .resource-btn {
      border: 1px solid var(--linha);
      border-radius: 12px;
      padding: 10px 11px;
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 9px;
      background: #fff;
      text-align: left;
      color: var(--texto);
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .resource-btn:active { transform: translateY(1px); }
    .resource-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 17px; }
    .resource-btn.manual .resource-icon { background: #eaf5ff; color: #0b79c7; }
    .resource-btn.video .resource-icon { background: #fff0f0; color: #d93025; }
    .resource-btn.whatsapp .resource-icon { background: #e8f8ee; color: #168a46; }
    .resource-main { display: block; font-size: 12.5px; font-weight: 800; line-height: 1.25; }
    .resource-sub { display: block; margin-top: 3px; font-size: 10.5px; line-height: 1.3; color: var(--texto-suave); font-weight: 500; }
    .resource-arrow { color: #a4adb5; font-size: 18px; }
    .citation {
      margin-top: 12px;
      border-top: 1px solid #edf0f2;
      padding-top: 9px;
      color: #74808a;
      font-size: 10.5px;
    }
    .offline-badge {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      margin-top: 6px;
      padding: 4px 7px;
      border-radius: 8px;
      background: #f1f8f3;
      color: #227244;
      font-weight: 750;
    }

    .composer {
      background: #f8fafb;
      border-top: 1px solid #d7dee3;
      padding: 8px 9px calc(8px + var(--safe-bottom));
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 3;
    }
    .composer input {
      flex: 1;
      min-width: 0;
      border: 1px solid #dbe1e6;
      background: #fff;
      border-radius: 999px;
      padding: 11px 15px;
      outline: none;
      color: var(--texto);
    }
    .composer input:focus { border-color: #83bce4; box-shadow: 0 0 0 3px rgba(7,136,229,.11); }
    .send-btn {
      width: 43px; height: 43px; border: 0; border-radius: 50%;
      background: var(--verde); color: #fff; display: grid; place-items: center;
      box-shadow: 0 4px 12px rgba(32,165,90,.28);
    }
    .send-btn svg { width: 21px; height: 21px; fill: currentColor; }

    .modal {
      position: fixed; inset: 0; z-index: 30;
      display: none;
      background: #111923;
      color: #fff;
    }
    .modal.open { display: flex; flex-direction: column; }
    .modal-head {
      padding: calc(8px + var(--safe-top)) 10px 8px;
      min-height: calc(58px + var(--safe-top));
      display: flex; align-items: center; gap: 9px;
      background: #07121f;
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
      z-index: 2;
    }
    .icon-btn {
      width: 38px; height: 38px; border: 0; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(255,255,255,.1); color: #fff;
      font-size: 20px; flex: none;
    }
    .modal-title { flex: 1; min-width: 0; }
    .modal-title strong { display: block; font-size: 14px; }
    .modal-title span { display: block; color: rgba(255,255,255,.65); font-size: 10.5px; margin-top: 2px; }
    .zoom-group { display: flex; gap: 5px; }
    .zoom-btn { width: 34px; height: 34px; border: 0; border-radius: 9px; background: rgba(255,255,255,.1); color: #fff; font-weight: 800; }
    .manual-view {
      flex: 1;
      overflow: auto;
      padding: 12px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: #252e38;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y pinch-zoom;
    }
    .manual-page {
      width: min(100%, 920px);
      max-width: none;
      height: auto;
      display: block;
      background: #fff;
      box-shadow: 0 8px 30px rgba(0,0,0,.38);
      transform-origin: top center;
      transition: width .12s ease;
    }
    .manual-footer {
      background: #07121f;
      padding: 8px 12px calc(8px + var(--safe-bottom));
      color: rgba(255,255,255,.68);
      font-size: 10.5px;
      text-align: center;
    }

    .toast {
      position: fixed;
      z-index: 50;
      left: 50%; bottom: calc(78px + var(--safe-bottom));
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      width: min(90vw, 420px);
      padding: 11px 13px;
      border-radius: 11px;
      background: rgba(20,28,35,.94);
      color: #fff;
      text-align: center;
      font-size: 12px;
      box-shadow: var(--sombra);
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (min-width: 700px) {
      body { padding: 18px 0; }
      #app { height: calc(100vh - 36px); height: calc(100dvh - 36px); border-radius: 18px; }
      .modal { left: 50%; width: min(100%, 980px); transform: translateX(-50%); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="Assistente K30i Wi-Fi">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="head-text">
        <div class="head-title">Assistente K30i</div>
        <div class="head-subtitle">Teste rápido - configuração Wi-Fi</div>
      </div>
      <div id="networkPill" class="network-pill" title="Estado da conexão deste telefone">
        <span class="network-dot"></span>
        <span id="networkText">Verificando...</span>
      </div>
    </header>

    <section id="chat" aria-live="polite">
      <div class="day-separator">TESTE DE CONECTIVIDADE</div>
    </section>

    <form id="composer" class="composer" autocomplete="off">
      <input id="messageInput" type="text" inputmode="text" placeholder="Digite: configurar Wi-Fi" aria-label="Mensagem">
      <button class="send-btn" type="submit" aria-label="Enviar mensagem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </form>
  </main>

  <section id="manualModal" class="modal" role="dialog" aria-modal="true" aria-label="Manual K30i página 65">
    <header class="modal-head">
      <button id="closeManual" class="icon-btn" type="button" aria-label="Fechar manual">←</button>
      <div class="modal-title">
        <strong>Manual K30i - Configurar Wi-Fi</strong>
        <span>Revisão 02 · Seção 6.10 · Página 65</span>
      </div>
      <div class="zoom-group" aria-label="Controles de zoom">
        <button id="zoomOut" class="zoom-btn" type="button" aria-label="Diminuir zoom">−</button>
        <button id="zoomReset" class="zoom-btn" type="button" aria-label="Restaurar zoom">1:1</button>
        <button id="zoomIn" class="zoom-btn" type="button" aria-label="Aumentar zoom">+</button>

  <script>
    'use strict';

    const CONFIG = Object.freeze({
      whatsappNumber: '5535998699768',
      whatsappMessage:
        'Olá, preciso de suporte técnico sobre o controlador K30i.\n' +
        'Assunto: Configuração do Wi-Fi.\n' +
        'Manual consultado: Revisão 02 - Seção 6.10 - página 65.\n' +
        'Situação encontrada: ',
      videoUrl: 'https://www.youtube.com/@KVAIND/videos'
    });

    const chat = document.getElementById('chat');
    const composer = document.getElementById('composer');
    const messageInput = document.getElementById('messageInput');
    const manualModal = document.getElementById('manualModal');
    const manualView = document.getElementById('manualView');
    const manualPage = document.getElementById('manualPage');
    const toast = document.getElementById('toast');
    const networkPill = document.getElementById('networkPill');
    const networkText = document.getElementById('networkText');

    let answerShown = false;
    let toastTimer = null;
    let zoom = 1;

    function currentTime() {
      return new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' }).format(new Date());
    }

    function showToast(message, duration = 3100) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    function scrollToEnd() {
      requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
    }

    function appendUserMessage(text) {
      const row = document.createElement('div');
      row.className = 'message-row user';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const content = document.createElement('span');
      content.textContent = text;
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = currentTime();
      bubble.append(content, time);
      row.appendChild(bubble);
      chat.appendChild(row);
      scrollToEnd();
    }

    function appendAppMessage(html) {
      const row = document.createElement('div');
      row.className = 'message-row app';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = html + '<span class="time">' + currentTime() + '</span>';
      row.appendChild(bubble);
      chat.appendChild(row);
      scrollToEnd();
      return bubble;
    }

    function welcome() {
      const bubble = appendAppMessage(
        '<div class="intro-title">Olá! 👋</div>' +
        '<div class="intro-note">Este protótipo contém apenas o procedimento de configuração Wi-Fi do K30i e a página correspondente do manual para consulta offline.</div>' +
        '<div class="quick-actions">' +
          '<button class="quick-btn" type="button" data-action="wifi">📶 <span>Como configurar o Wi-Fi</span></button>' +
        '</div>'
      );
      bubble.querySelector('[data-action="wifi"]').addEventListener('click', showWifiFlow);
    }

    function wifiAnswerHtml() {
      return `
        <article class="answer-card">
          <div class="answer-header">
            <div class="answer-icon">📶</div>
            <div>
              <div class="answer-title">Como configurar o Wi-Fi</div>
              <span class="source-chip">✓ Conteúdo conferido no manual</span>
            </div>
          </div>

          <div class="path-box">
            <strong>Caminho no controlador:</strong><br>

          bindResourceButtons(bubble);
          answerShown = true;
          setTimeout(() => bubble.scrollIntoView({ behavior: 'smooth', block: 'start' }), 40);
        }, 280);
      } else {
        const answer = chat.querySelector('.answer-card');
        answer?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function bindResourceButtons(scope) {
      scope.querySelector('[data-resource="manual"]').addEventListener('click', openManual);
      scope.querySelector('[data-resource="video"]').addEventListener('click', openVideo);
      scope.querySelector('[data-resource="whatsapp"]').addEventListener('click', openWhatsApp);
    }

    function openManual() {
      zoom = 1;
      applyZoom();
      manualView.scrollTop = 0;
      manualView.scrollLeft = 0;
      manualModal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeManual() {
      manualModal.classList.remove('open');
      document.body.style.overflow = '';
    }

    function applyZoom() {
      manualPage.style.width = (Math.round(zoom * 100)) + '%';
    }

    function openVideo() {
      if (!navigator.onLine) {
        showToast('O vídeo requer internet. A página do manual continua disponível offline.');
        return;
      }
      window.open(CONFIG.videoUrl, '_blank', 'noopener,noreferrer');
    }

    async function openWhatsApp() {
      const encoded = encodeURIComponent(CONFIG.whatsappMessage);
      const appUrl = `whatsapp://send?phone=${CONFIG.whatsappNumber}&text=${encoded}`;
      const webUrl = `https://wa.me/${CONFIG.whatsappNumber}?text=${encoded}`;

      try {
        await navigator.clipboard?.writeText(CONFIG.whatsappMessage);
      } catch (_) {}

      showToast(navigator.onLine
        ? 'Abrindo o WhatsApp com a mensagem de suporte preenchida.'
        : 'Abrindo o WhatsApp. O envio ficará dependente de sinal; a mensagem também foi preparada.');

      window.location.href = appUrl;
      if (navigator.onLine) {
        setTimeout(() => {
          if (document.visibilityState === 'visible') window.open(webUrl, '_blank', 'noopener,noreferrer');
        }, 1300);
      }
    }

    function updateNetworkStatus() {
      const online = navigator.onLine;
      networkPill.classList.toggle('online', online);
      networkPill.classList.toggle('offline', !online);
      networkText.textContent = online ? 'Online' : 'Offline';
      networkPill.title = online
        ? 'O telefone possui conexão. O manual também funciona sem internet.'
        : 'Sem internet. O procedimento e a página do manual continuam disponíveis.';
    }

    composer.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;
      messageInput.value = '';
      appendUserMessage(text);
      const normalized = text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      const isWifi = normalized.includes('wifi') || normalized.includes('wi-fi') || normalized.includes('internet') || normalized.includes('rede');
      setTimeout(() => {
        if (isWifi) {
          const bubble = appendAppMessage(wifiAnswerHtml());
          bindResourceButtons(bubble);
          answerShown = true;
          setTimeout(() => bubble.scrollIntoView({ behavior: 'smooth', block: 'start' }), 40);
        } else {
          appendAppMessage('Este protótipo responde somente sobre <strong>configuração Wi-Fi do K30i</strong>.<br><br>Digite <strong>configurar Wi-Fi</strong> ou use o botão inicial.');
        }
      }, 280);
    });

    document.getElementById('closeManual').addEventListener('click', closeManual);
    document.getElementById('zoomIn').addEventListener('click', () => { zoom = Math.min(2.5, zoom + .25); applyZoom(); });
    document.getElementById('zoomOut').addEventListener('click', () => { zoom = Math.max(.65, zoom - .25); applyZoom(); });
    document.getElementById('zoomReset').addEventListener('click', () => { zoom = 1; applyZoom(); manualView.scrollTop = 0; manualView.scrollLeft = 0; });
    manualModal.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeManual(); });
    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);

    updateNetworkStatus();
    welcome();
  </script>
</body>
</html>
